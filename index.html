<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="PP3 Settings">

<title>PP3 Product Settings – North Sails</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
  :root{
    --navy:#003f80; --navy2:#0a4f99; --nsblue:#005cb9; --sail:#f6f5f1; --white:#ffffff; --carbon:#24292e;
    --grey:#6b7480; --line:#dfe2e6; --blue:#005cb9; --blue-l:#e5f0fb; --danger:#c62828; --ok:#1b7f4b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--sail);color:var(--carbon);font:16px/1.45 Inter,-apple-system,"Segoe UI",Roboto,sans-serif}
  .head{font-family:Outfit,Inter,sans-serif;text-transform:uppercase;letter-spacing:.08em}
  header{position:sticky;top:0;z-index:5;background:var(--nsblue);color:#fff;
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
  header .row{display:flex;align-items:center;gap:10px}
  .brand{font-family:Outfit,sans-serif;font-weight:700;font-size:13px;letter-spacing:.14em;color:#cfe2f7;text-transform:uppercase}
  h1{font-family:Outfit,sans-serif;font-weight:700;font-size:18px;letter-spacing:.03em;text-transform:uppercase;margin:2px 0 0;flex:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .ghost{color:#fff}
  .search{margin-top:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff}
  .search::placeholder{color:#cfe2f7}
  .logo{width:46px;height:46px;flex:none;border-radius:50%;box-shadow:0 0 0 2px #fff}
  main{padding:14px 16px calc(110px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
  input,textarea{width:100%;background:var(--white);color:var(--carbon);border:1px solid var(--line);
    border-radius:4px;padding:13px 12px;font-size:17px;font-family:inherit}
  input:focus,textarea:focus{outline:2px solid var(--blue);border-color:transparent}
  textarea{min-height:110px;resize:vertical}
  label{display:block;font-family:Outfit,sans-serif;font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);margin:16px 0 6px}
  label .req{color:var(--danger)}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
  .two > div{min-width:0}
  input{height:52px;min-width:0;display:block;-webkit-appearance:none;appearance:none}
  input[type=date]{text-align:left;line-height:normal}
  input[type=date]::-webkit-date-and-time-value{text-align:left}
  textarea{height:auto}
  .unit{position:relative}
  .unit input{padding-right:62px}
  .unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--grey);font-size:15px}
  button{font:600 16px Inter,sans-serif;border:0;border-radius:4px;padding:14px 16px;cursor:pointer;color:var(--carbon);background:#e9ebee}
  button.primary{background:var(--navy);color:#fff;font-family:Outfit,sans-serif;letter-spacing:.1em;text-transform:uppercase}
  button.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
  button.ghost{background:transparent;padding:8px 2px;font-weight:500}
  button:disabled{opacity:.5}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{display:flex;gap:12px;align-items:center;background:var(--white);border:1px solid var(--line);border-left:4px solid var(--navy);
    border-radius:4px;padding:10px;cursor:pointer}
  .thumb{width:68px;height:68px;border-radius:3px;background:#eef0f3 center/cover no-repeat;flex:none;
    display:flex;align-items:center;justify-content:center;color:var(--grey);font-size:11px;text-align:center}
  .item .t{font-weight:600;font-size:17px}
  .item .m{color:var(--grey);font-size:13px}
  .speed{display:inline-block;background:var(--blue-l);color:var(--navy);font-weight:600;font-size:13px;padding:2px 8px;border-radius:3px;margin-top:3px}
  .fab{background:var(--nsblue)!important;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));padding:16px 22px;font-size:15px;box-shadow:0 6px 18px rgba(11,31,58,.35)}
  .card{background:var(--white);border:1px solid var(--line);border-radius:4px;padding:14px;margin-top:12px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{background:var(--white);border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:4px;padding:12px}
  .kpi .v{font-family:Outfit,sans-serif;font-size:26px;font-weight:700;color:var(--navy)}
  .kpi .v small{font-size:14px;color:var(--grey);font-weight:400}
  .cap-h{font-family:Outfit,sans-serif;font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey)}
  .notes{white-space:pre-wrap;margin-top:6px}
  .sub{color:var(--grey);font-size:13px}
  .photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
  .ph{background:#f1f3f5;border-radius:4px;overflow:hidden;border:1px solid var(--line);position:relative}
  .ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in;background:#dde1e6}
  .ph .cap{padding:7px 8px;font-size:14px;font-weight:500}
  .ph .cap input{padding:7px 8px;font-size:15px}
  .ph .x{position:absolute;top:6px;right:6px;background:rgba(11,31,58,.8);color:#fff;border-radius:20px;padding:4px 10px;font-size:14px}
  .addph{border:2px dashed #b9c2cc;border-radius:4px;display:flex;align-items:center;justify-content:center;
    flex-direction:column;min-height:140px;color:var(--navy);cursor:pointer;gap:4px;text-align:center;padding:8px;background:var(--white);font-weight:600}
  .addph span{font-size:30px;line-height:1}
  .bar{display:flex;gap:10px;margin-top:18px}
  .bar button{flex:1}
  .empty{color:var(--grey);text-align:center;padding:40px 10px}
  .hidden{display:none!important}
  .viewer{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
  .viewer .top{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;color:#fff}
  .viewer .stage{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
  .viewer img{display:block;margin:auto;max-width:none}
  .viewer .zoom{display:flex;gap:10px;justify-content:center;padding:10px 0 calc(14px + env(safe-area-inset-bottom))}
  .modal{position:fixed;inset:0;background:rgba(11,31,58,.55);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal .box{background:var(--white);border-radius:6px;padding:18px;max-width:380px;width:100%}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));
    background:var(--navy);color:#fff;padding:10px 16px;border-radius:4px;z-index:40;font-size:14px}
  .busy{position:fixed;inset:0;background:rgba(246,245,241,.8);z-index:35;display:flex;align-items:center;justify-content:center;color:var(--navy);font-weight:600}
  .banner{background:#fff4d6;color:#6b4e00;font-size:12px;padding:6px 8px;border-radius:3px;margin-top:8px}
</style>
</head>

<script>
const MODE = "direct";   // "direct" = real app (Supabase JS)  |  "mcp" = Claude artifact (via your Supabase connector)
const SB_URL = "https://vphuwjtyfwmmawicdtfc.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwaHV3anR5ZndtbWF3aWNkdGZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2Mzc1NjMsImV4cCI6MjExMDIxMzU2M30.PRYRl5EI18oyBPwT_5-17UkU_r-VK40eZpgTNtJL1L0";
const PROJECT_ID = "vphuwjtyfwmmawicdtfc";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDT = d => new Date(d).toLocaleString([], {day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const fmtD = d => d ? new Date(d+"T00:00:00").toLocaleDateString([], {weekday:"short",day:"2-digit",month:"short",year:"numeric"}) : "—";
const today = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const num = v => v==null||v==="" ? null : Number(v);

/* ======================= DATA LAYER =======================
   Same functions for both modes; only the transport differs. */
let api;
if (MODE === "direct") {
  const sb = supabase.createClient(SB_URL, SB_KEY);
  const chk = r => { if (r.error) throw r.error; return r.data; };
  api = {
    list: async () => chk(await sb.from("ns_product_list").select("*")
                .order("run_date",{ascending:false,nullsFirst:false}).order("updated_at",{ascending:false})),
    get: async id => {
      const p = chk(await sb.from("ns_products").select("*").eq("id",id).single());
      p.photos = chk(await sb.from("ns_photos").select("id,caption,data_url,created_at").eq("product_id",id).order("created_at"));
      return p;
    },
    save: async (id,row) => id ? (chk(await sb.from("ns_products").update(row).eq("id",id)), id)
                               : chk(await sb.from("ns_products").insert(row).select("id").single()).id,
    addPhoto: async (pid,ph) => chk(await sb.from("ns_photos").insert({product_id:pid,caption:ph.caption||null,data_url:ph.data_url,thumb_url:ph.thumb_url})),
    setCaption: async (phid,c) => chk(await sb.from("ns_photos").update({caption:c||null}).eq("id",phid)),
    delPhoto: async phid => chk(await sb.from("ns_photos").delete().eq("id",phid)),
    delProduct: async id => chk(await sb.from("ns_products").delete().eq("id",id)),
  };
} else {
  // Claude artifact: runs SQL through the viewer's own Supabase connector
  let mcpP = null;
  const mcp = () => mcpP || (mcpP = window.claude.use("mcp"));
  const L = v => v==null || v==="" ? "null" : (typeof v==="number" ? String(v) : "'"+String(v).replace(/'/g,"''")+"'");
  function findText(o){
    if (typeof o === "string") return o;
    if (Array.isArray(o)) { for (const x of o){ const t=findText(x); if(t && t.includes("untrusted-data")) return t; } return o.length&&typeof o[0]==="object"&&!o[0].text ? JSON.stringify(o) : null; }
    if (o && typeof o === "object") { for (const k of ["result","text","content","payload"]) if (k in o){ const t=findText(o[k]); if(t) return t; }
      for (const k in o){ const t=findText(o[k]); if(t && t.includes("untrusted-data")) return t; } }
    return null;
  }
  async function sql(q){
    const m = await mcp(); if (!m) throw new Error("Supabase connector not available");
    const r = await m.callTool("Supabase","execute_sql",{project_id:PROJECT_ID, query:q});
    let t = findText(r.payload ?? r) || "";
    try { const o = JSON.parse(t); if (o && typeof o.result === "string") t = o.result; else if (Array.isArray(o)) return o; } catch(e){}
    const mt = t.match(/<untrusted-data-[^>]*>\s*([\s\S]*?)\s*<\/untrusted-data/);
    const body = mt ? mt[1] : t;
    const s = body.indexOf("["), e = body.lastIndexOf("]");
    return s>=0 ? JSON.parse(body.slice(s,e+1)) : [];
  }
  api = {
    list: () => sql(`select * from public.ns_product_list order by run_date desc nulls last, updated_at desc`),
    get: async id => {
      const [p] = await sql(`select * from public.ns_products where id=${L(id)}`);
      p.photos = await sql(`select id,caption,data_url,created_at from public.ns_photos where product_id=${L(id)} order by created_at`);
      return p;
    },
    save: async (id,r) => {
      if (id) { await sql(`update public.ns_products set name=${L(r.name)},code=${L(r.code)},notes=${L(r.notes)},operator=${L(r.operator)},
                 run_date=${L(r.run_date)},line_speed=${L(r.line_speed)},updated_at=now() where id=${L(id)}`); return id; }
      const [x] = await sql(`insert into public.ns_products(name,code,notes,operator,run_date,line_speed)
                 values(${L(r.name)},${L(r.code)},${L(r.notes)},${L(r.operator)},${L(r.run_date)},${L(r.line_speed)}) returning id`);
      return x.id;
    },
    addPhoto: (pid,ph) => sql(`insert into public.ns_photos(product_id,caption,data_url,thumb_url) values(${L(pid)},${L(ph.caption)},${L(ph.data_url)},${L(ph.thumb_url)})`),
    setCaption: (phid,c) => sql(`update public.ns_photos set caption=${L(c)} where id=${L(phid)}`),
    delPhoto: phid => sql(`delete from public.ns_photos where id=${L(phid)}`),
    delProduct: id => sql(`delete from public.ns_products where id=${L(id)}`),
  };
}
const photoSrc = p => p.preview || p.data_url || "";

/* ======================= UI ======================= */
let rows = [], current = null, edit = null;

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function busy(on, txt="Saving…"){ $("busy").textContent=txt; $("busy").classList.toggle("hidden",!on); }
function ask(text, withInput=false, value=""){
  return new Promise(res=>{
    $("mText").textContent=text; $("mInput").classList.toggle("hidden",!withInput); $("mInput").value=value;
    $("modal").classList.remove("hidden"); if(withInput) setTimeout(()=>$("mInput").focus(),50);
    const done=v=>{ $("modal").classList.add("hidden"); res(v); };
    $("mYes").onclick=()=>done(withInput ? $("mInput").value.trim() : true);
    $("mNo").onclick=()=>done(withInput ? null : false);
  });
}

function getOp(){ try{return localStorage.getItem("ns_operator")||"";}catch(e){return "";} }
function setOp(v){ try{localStorage.setItem("ns_operator",v);}catch(e){} renderOp(); }
function renderOp(){ $("opBtn").textContent = getOp() ? "👷 "+getOp() : "👷 Name"; }
$("opBtn").onclick = async()=>{ const v = await ask("Operator name:", true, getOp()); if(v!==null) setOp(v); };

function show(view){
  ["vList","vDetail","vEdit"].forEach(v=>$(v).classList.toggle("hidden", v!==view));
  $("search").classList.toggle("hidden", view!=="vList");
  $("newBtn").classList.toggle("hidden", view!=="vList");
  $("backBtn").classList.toggle("hidden", view==="vList");
  $("logo").classList.toggle("hidden", view!=="vList");
  $("opBtn").classList.toggle("hidden", view!=="vList");
  window.scrollTo(0,0);
}

async function loadList(){
  try { rows = await api.list(); renderList(); }
  catch(e){ console.error(e); $("list").innerHTML=`<div class="empty">Can't reach the database.<br><small>${esc(e.message||e)}</small></div>`; }
}
function renderList(){
  const q = $("search").value.trim().toLowerCase();
  const r = rows.filter(p => !q || [p.name,p.code,p.notes].some(f => (f||"").toLowerCase().includes(q)));
  $("emptyList").classList.toggle("hidden", rows.length>0);
  $("list").innerHTML = r.map(p=>`
    <div class="item" data-id="${p.id}">
      <div class="thumb" style="${p.thumb?`background-image:url('${p.thumb}')`:""}">${p.thumb?"":"no photo"}</div>
      <div style="flex:1;min-width:0">
        <div class="t">${esc(p.name)}</div>
        <div class="m">${fmtD(p.run_date)}${p.code?" · "+esc(p.code):""}</div>
        <span class="speed">${p.line_speed!=null?Number(p.line_speed).toFixed(2)+" m/min":"speed –"}</span>
        <span class="m"> · ${p.photo_count} photo${p.photo_count==1?"":"s"}</span>
      </div><div class="m">›</div>
    </div>`).join("") || (rows.length ? `<div class="empty">No match.</div>` : "");
  document.querySelectorAll(".item").forEach(el=>el.onclick=()=>openDetail(el.dataset.id));
}
$("search").oninput = renderList;

async function openDetail(id){
  busy(true,"Loading…");
  try { current = await api.get(id); } catch(e){ busy(false); toast("Couldn't load"); console.error(e); return; }
  busy(false);
  const p = current;
  $("title").textContent = p.name;
  $("dSpeed").innerHTML = p.line_speed!=null ? Number(p.line_speed).toFixed(2)+" <small>m/min</small>" : "–";
  $("dDate").textContent = fmtD(p.run_date);
  $("dCode").textContent = p.code ? "Code: "+p.code : "No product code";
  $("dMeta").textContent = "Last updated "+fmtDT(p.updated_at)+(p.operator?" by "+p.operator:"");
  $("dNotes").textContent = p.notes || "—";
  $("pdfBtn").parentElement.classList.toggle("hidden", MODE!=="direct");
  $("dPhotos").innerHTML = p.photos.length ? p.photos.map((f,i)=>`
    <div class="ph"><img src="${photoSrc(f)}" data-i="${i}" alt="">
    <div class="cap">${esc(f.caption)||"<span class='sub'>Screen "+(i+1)+"</span>"}</div></div>`).join("")
    : `<div class="sub">No photos yet.</div>`;
  $("dPhotos").querySelectorAll("img").forEach(im=>im.onclick=()=>{
    const f=p.photos[+im.dataset.i]; openViewer(photoSrc(f), f.caption||("Screen "+(+im.dataset.i+1)));
  });
  show("vDetail");
}
$("editBtn").onclick = ()=>openEdit(current);

/* ---------- Run sheet PDF, built on the phone from this run's data + photos ---------- */
const imgSize = src => new Promise(r=>{ const i=new Image(); i.onload=()=>r([i.naturalWidth,i.naturalHeight]); i.onerror=()=>r([4,3]); i.src=src; });
$("pdfBtn").onclick = async()=>{
  const p=current; if(!p) return;
  if(!window.jspdf){ toast("PDF tool still loading – try again"); return; }
  busy(true,"Building run sheet…");
  try{
    const { jsPDF } = window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"});
    const W=210,H=297,M=15;
    const header=()=>{ doc.setFillColor(0,92,185); doc.rect(0,0,W,24,"F");
      try{ doc.addImage($("logo").src,"PNG",M,4,16,16); }catch(e){}
      doc.setTextColor(255); doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.text("PP3 RUN SHEET",M+21,12);
      doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.text("North Sails Sri Lanka \u00b7 Pre Preg Line 3",M+21,18); doc.setTextColor(30); };
    header(); let y=34;
    const rows=[["Product",p.name],["Product / batch code",p.code||"\u2013"],["Run date",fmtD(p.run_date)],
      ["Line speed",p.line_speed!=null?Number(p.line_speed).toFixed(2)+" m/min":"\u2013"],["Operator",p.operator||"\u2013"],["Last updated",fmtDT(p.updated_at)]];
    rows.forEach(([k,v],i)=>{ if(i%2===0){ doc.setFillColor(229,240,251); doc.rect(M,y-5.5,W-2*M,8,"F"); }
      doc.setFontSize(10); doc.setFont("helvetica","bold"); doc.text(k,M+2,y); doc.setFont("helvetica","normal"); doc.text(String(v),M+55,y); y+=8; });
    y+=4; doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.text("Notes",M,y); y+=6;
    doc.setFont("helvetica","normal"); doc.setFontSize(10);
    const lines=doc.splitTextToSize(p.notes||"\u2014",W-2*M); doc.text(lines,M,y); y+=lines.length*5+6;
    for(const [i,f] of p.photos.entries()){
      const src=photoSrc(f); if(!src) continue;
      const [iw,ih]=await imgSize(src); let w=W-2*M, h=w*ih/iw; if(h>118){ h=118; w=h*iw/ih; }
      if(y+h+10>H-15){ doc.addPage(); header(); y=34; }
      doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.text(f.caption||("Screen "+(i+1)),M,y);
      doc.addImage(src,"JPEG",(W-w)/2,y+3,w,h); y+=h+12;
    }
    const n=doc.getNumberOfPages();
    for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(110);
      doc.text("PP3 Run Sheet \u00b7 "+p.name+" \u00b7 "+(p.run_date||""),M,H-8); doc.text("Page "+i+" of "+n,W-M,H-8,{align:"right"}); }
    const name=("PP3 Run Sheet - "+p.name+" - "+(p.run_date||"")).replace(/[\\/:*?"<>|]/g,"-")+".pdf";
    busy(false);
    const blob=doc.output("blob"); const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=name; a.target="_blank"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){ busy(false); console.error(e); toast("Couldn't build the PDF"); }
};

function openEdit(p){
  edit = { id:p?.id, photos:(p?.photos||[]).map(x=>({...x})), removed:[] };
  $("fName").value=p?.name||""; $("fCode").value=p?.code||""; $("fNotes").value=p?.notes||"";
  $("fDate").value=p?.run_date||today(); $("fSpeed").value=p?.line_speed??"";
  $("delBtn").classList.toggle("hidden", !p);
  $("title").textContent = p ? "Edit run" : "New run";
  renderEditPhotos(); show("vEdit");
}
function renderEditPhotos(){
  const box=$("fPhotos"); box.querySelectorAll(".ph").forEach(e=>e.remove());
  edit.photos.forEach((p,i)=>{
    const d=document.createElement("div"); d.className="ph";
    d.innerHTML=`<img src="${photoSrc(p)}" alt=""><button class="x">✕</button>
      <div class="cap"><input placeholder="Screen name, e.g. Oven temps" value="${esc(p.caption)}"></div>`;
    d.querySelector("input").oninput=e=>{p.caption=e.target.value; p.dirty=true;};
    d.querySelector("img").onclick=()=>openViewer(photoSrc(p), p.caption||"");
    d.querySelector(".x").onclick=async()=>{ if(!(await ask("Remove this photo?"))) return;
      if(p.id) edit.removed.push(p); edit.photos.splice(i,1); renderEditPhotos(); };
    box.insertBefore(d,$("addPh"));
  });
}
$("addPh").onclick=()=>$("fileIn").click();
$("fileIn").onchange=async e=>{
  busy(true,"Preparing photo…");
  for(const f of e.target.files){
    const data_url = await shrink(f,1600,0.72), thumb_url = await shrink(f,240,0.6);
    edit.photos.push({caption:"",data_url,thumb_url,isNew:true});
  }
  busy(false); e.target.value=""; renderEditPhotos();
};
// Resize so photos upload quickly but HMI numbers stay readable
function shrink(file,max,q){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{ let w=img.width,h=img.height; const s=Math.min(1,max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
      const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(img.src); res(c.toDataURL("image/jpeg",q)); };
    img.onerror=()=>res("");
    img.src=URL.createObjectURL(file);
  });
}

$("saveBtn").onclick=async()=>{
  const name=$("fName").value.trim(), run_date=$("fDate").value, line_speed=num($("fSpeed").value);
  if(!name){ toast("Enter the product name"); $("fName").focus(); return; }
  if(!run_date){ toast("Enter the run date"); $("fDate").focus(); return; }
  if(line_speed==null || isNaN(line_speed)){ toast("Enter the line speed"); $("fSpeed").focus(); return; }
  busy(true);
  try{
    const row={name,code:$("fCode").value.trim()||null,notes:$("fNotes").value.trim()||null,
               operator:getOp()||null,run_date,line_speed,updated_at:new Date().toISOString()};
    const id=await api.save(edit.id,row);
    for(const p of edit.removed) await api.delPhoto(p.id);
    let n=0; const total=edit.photos.filter(p=>p.isNew).length;
    for(const p of edit.photos){
      if(p.isNew){ busy(true,`Uploading photo ${++n} of ${total}…`); await api.addPhoto(id,p); }
      else if(p.dirty) await api.setCaption(p.id,p.caption);
    }
    busy(false); toast("Saved ✓");
    loadList(); await openDetail(id);
  }catch(err){ busy(false); console.error(err); toast("Save failed – check connection and try again"); }
};
$("cancelBtn").onclick=()=> edit.id ? openDetail(edit.id) : goHome();
$("delBtn").onclick=async()=>{
  if(!(await ask(`Delete this run of "${current.name}" and all its photos? This can't be undone.`))) return;
  busy(true,"Deleting…");
  try{ await api.delProduct(current.id); busy(false); toast("Deleted"); goHome(); }
  catch(e){ busy(false); toast("Delete failed"); }
};

let zoom=1;
function openViewer(src,cap){ $("vImg").src=src; $("vCap").textContent=cap||""; $("viewer").classList.remove("hidden");
  $("vImg").onload=fitImg; if($("vImg").complete) fitImg(); }
function fitImg(){ const st=$("vStage"),im=$("vImg"); im.dataset.base=Math.min(st.clientWidth/im.naturalWidth, st.clientHeight/im.naturalHeight); zoom=1; applyZoom(); }
function applyZoom(){ const im=$("vImg"),b=+im.dataset.base||1; im.style.width=im.naturalWidth*b*zoom+"px";
  im.style.marginTop=Math.max(0,($("vStage").clientHeight-im.naturalHeight*b*zoom)/2)+"px"; }
$("zIn").onclick=()=>{zoom=Math.min(zoom*1.5,8);applyZoom();};
$("zOut").onclick=()=>{zoom=Math.max(zoom/1.5,1);applyZoom();};
$("zFit").onclick=()=>{zoom=1;applyZoom();};
$("vImg").ondblclick=()=>{zoom=zoom>1?1:2.5;applyZoom();};
$("vClose").onclick=()=>$("viewer").classList.add("hidden");

function goHome(){ current=null; edit=null; $("title").textContent="Product Settings"; show("vList"); loadList(); }
$("backBtn").onclick=()=>{ if(!$("vEdit").classList.contains("hidden") && edit?.id) return openDetail(edit.id); goHome(); };
$("newBtn").onclick=()=>openEdit(null);

renderOp(); show("vList");
if (MODE==="mcp") $("list").innerHTML=`<div class="empty">Connecting to Supabase…</div>`;
loadList();
</script>
</body>
